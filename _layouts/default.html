<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1b">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | default: site.title }} · Shanika's journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@500;600;700&family=Dancing+Script:wght@500;600;700&family=Patrick+Hand&family=Schoolbell&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <meta name="color-scheme" content="dark">
  <style>
    :root{--paper:#fff8e9;--paper2:#fff0d4;--ink:#403b50;--muted:#777187;--line:#e9dcca;--coral:#ef8e78;--coral-dark:#bd6559;--lilac:#c9b7e8;--mint:#b9d9c5;--sky:#b9d9e8;--yellow:#f5d77e;--hand:'Patrick Hand',cursive;--caveat:'Caveat',cursive;--sketch:'Schoolbell',cursive}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.55 var(--hand);overflow-x:hidden;background-image:radial-gradient(#e7d9c8 0.7px,transparent .7px);background-size:18px 18px}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(135deg,rgba(255,248,233,.7),rgba(255,248,233,.92))}
    a{color:inherit}
    button,input,textarea{font:inherit}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(255,248,233,.92);backdrop-filter:blur(12px);border-bottom:2px dashed #e8d7c2}
    .nav{max-width:1160px;margin:auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{text-decoration:none;font:700 2rem/1 var(--caveat);color:var(--ink);transform:rotate(-2deg);display:inline-block}
    .brand span{color:var(--coral-dark)}
    .navlinks{display:flex;align-items:center;gap:25px}
    .navlinks a{text-decoration:none;color:var(--muted);font:600 1.45rem/1 var(--caveat);padding:7px 5px;transition:color .2s,transform .2s}
    .navlinks a:hover,.navlinks a.active{color:var(--coral-dark);transform:translateY(-2px) rotate(-2deg)}
    .navlinks a.active:after{content:"";display:block;height:3px;border-radius:4px;background:var(--yellow);margin-top:3px}
    .menu-toggle{display:none;background:#fffdf6;border:2px solid var(--line);border-radius:14px;width:42px;height:42px;color:var(--ink);font-size:1.3rem}
    main{max-width:1160px;margin:0 auto;padding:48px 28px 100px;min-height:72vh}
    .page-kicker,.eyebrow{font:600 1.25rem/1.2 var(--caveat);letter-spacing:.03em;color:var(--coral-dark)}
    h1,h2,h3{font-family:var(--sketch);line-height:.98;font-weight:400;letter-spacing:0;color:var(--ink)}
    h1{font-size:clamp(3.6rem,7vw,6.4rem)}
    h2{font-size:clamp(2.8rem,4vw,4rem)}
    p{color:#625d70}
    .journal-hero{display:grid;grid-template-columns:1.04fr .96fr;gap:5%;align-items:center;min-height:510px;padding:25px 0 65px;position:relative}
    .hero-copy{position:relative;z-index:2}
    .hero-copy h1{max-width:650px;margin:17px 0 20px}
    .hero-copy h1 em{color:var(--coral-dark);font-style:normal}
    .handwritten{font:700 clamp(2.2rem,4vw,3.5rem)/.95 var(--caveat);color:var(--coral-dark);letter-spacing:0;display:inline-block;transform:rotate(-4deg)}
    .hero-lede{max-width:500px;font-size:1.28rem;line-height:1.55}
    .hero-meta{display:flex;align-items:center;gap:12px;margin-top:25px;font:600 1.35rem var(--caveat);color:var(--muted)}
    .hero-meta:before{content:"";width:34px;height:3px;border-radius:5px;background:var(--yellow)}
    .book-stage{height:440px;display:grid;place-items:center;perspective:1100px;position:relative;isolation:isolate;transform-style:preserve-3d}
    .book-stage:after{content:'';position:absolute;width:270px;height:340px;border:2px dashed #e4b8a5;border-radius:18px;transform:translate(35px,15px) rotate(8deg);z-index:-1;animation:paper-wiggle 6s ease-in-out infinite}
    .book-stage:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(245,215,126,.45),transparent 68%);z-index:-1;animation:glow-breathe 5s ease-in-out infinite}
    .book-shadow{position:absolute;width:290px;height:48px;bottom:34px;background:rgba(64,59,80,.16);filter:blur(18px);border-radius:50%;transform:rotate(-8deg);animation:shadow-breathe 4s ease-in-out infinite}
    .book{position:relative;width:270px;height:350px;transform:rotateY(-22deg) rotateZ(-4deg);transform-style:preserve-3d;animation:book-float 5s ease-in-out infinite;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
    .book-stage:hover .book{transform:rotateY(-9deg) rotateX(5deg) rotateZ(-1deg) translateY(-12px) scale(1.025)}
    .book-cover{position:absolute;inset:0;border-radius:9px 18px 18px 9px;background:linear-gradient(145deg,#f39b82,#d97569 72%);box-shadow:inset 8px 0 10px rgba(255,255,255,.24),inset -5px 0 10px rgba(100,40,40,.12),12px 22px 32px rgba(64,59,80,.2);padding:35px 30px;color:#fff9ed;display:flex;flex-direction:column;justify-content:space-between;transform:translateZ(11px);overflow:hidden}
    .book-cover:before{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,249,237,.55);border-radius:10px}
    .book-label{font:600 1.1rem var(--caveat);letter-spacing:.04em}
    .book-title{font:700 3rem/.95 var(--caveat);max-width:190px;color:#fff9ed}
    .book-mark{font:600 1.15rem var(--caveat);display:flex;justify-content:space-between;align-items:center}
    .book-pages{position:absolute;top:7px;bottom:7px;right:-13px;width:18px;background:repeating-linear-gradient(90deg,#fff8e9 0,#fff8e9 2px,#e7d9c8 3px,#fffdf7 4px);transform:translateZ(-2px) skewY(1deg);border-radius:0 5px 5px 0}
    .book-back{position:absolute;inset:4px 0 0 8px;border-radius:9px 18px 18px 9px;background:#b95e5a;transform:translateZ(-9px)}
    .book-spine{position:absolute;left:-8px;top:0;height:100%;width:18px;background:linear-gradient(90deg,#b85e5b,#f5a18b,#c66a60);transform:rotateY(-90deg) translateZ(9px);transform-origin:right;border-radius:5px 0 0 5px}
    .floating-note{position:absolute;right:1%;top:16%;padding:13px 17px;background:#fffdf6;border:2px solid #ecd9c6;border-radius:8px 18px 12px 16px;box-shadow:5px 7px 0 rgba(201,183,232,.5);font:1.25rem/1.15 var(--hand);color:var(--muted);transform:rotate(5deg);animation:note-bob 4.8s ease-in-out infinite}
    .floating-note strong{display:block;color:var(--coral-dark);font:700 1.8rem var(--caveat);margin-bottom:3px}
    .handwritten-note{position:absolute;left:0;bottom:17%;font:700 2.2rem var(--caveat);color:#7d6ca9;transform:rotate(-10deg);animation:note-bob 5.5s ease-in-out infinite reverse}
    .paper-orbit{position:absolute;width:65px;height:82px;background:linear-gradient(145deg,#fffdf8,#e7dfd2);border:1px solid #e7d9c8;box-shadow:5px 8px 0 rgba(185,217,197,.7);z-index:-1}
    .paper-orbit.one{right:5%;bottom:13%;transform:rotate(15deg);animation:paper-bob 6s ease-in-out infinite}
    .paper-orbit.two{left:8%;top:14%;width:45px;height:58px;transform:rotate(-18deg);animation:paper-bob 5s ease-in-out -2s infinite}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-top:2px dashed var(--line);padding-top:24px;margin-bottom:22px}
    .section-head h2{margin:0;font-size:3rem}
    .text-link{font:700 1.5rem var(--caveat);text-decoration:none;color:var(--coral-dark);border-bottom:2px solid var(--yellow);padding-bottom:2px}
    .entries{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .entry{display:block;min-height:225px;padding:22px 22px 25px;text-decoration:none;border:2px solid #e9dcca;border-radius:18px 12px 20px 13px;background:#fffdf6;box-shadow:4px 5px 0 #e9dfd0;transition:transform .35s,box-shadow .35s,background .35s;position:relative;overflow:hidden;transform-style:preserve-3d}
    .entry:nth-child(3n+2){border-radius:12px 20px 13px 18px;transform:rotate(.5deg)}
    .entry:nth-child(3n){transform:rotate(-.5deg)}
    .entry:hover{transform:translateY(-8px) rotateX(5deg) rotateY(-4deg) rotateZ(-1deg);box-shadow:10px 14px 0 #e4d6c6;background:#fff}
    .entry-date{font:600 1.3rem var(--caveat);color:var(--coral-dark)}
    .entry h3{font:700 2rem/.98 var(--caveat);margin:16px 0 9px}
    .entry p{font-size:1.12rem;line-height:1.45;margin:0}
    .entry-arrow{position:absolute;right:17px;bottom:12px;color:var(--coral-dark);font-size:1.4rem}
    .empty-note{padding:30px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
    .content-page{max-width:850px;margin:22px auto 0;background:rgba(255,253,246,.75);border:2px solid #ecdfce;border-radius:22px 16px 24px 17px;padding:clamp(22px,5vw,48px);box-shadow:8px 10px 0 rgba(201,183,232,.25)}
    .content-page>h1{font:700 clamp(3.8rem,7vw,5.8rem)/.92 var(--caveat);letter-spacing:0;color:var(--ink);margin:13px 0 28px}
    .content-page p,.content-page li{font:1.28rem/1.6 var(--hand);color:#625d70}
    .content-page h2{margin-top:40px}
    .content-page a{color:var(--coral-dark);text-decoration-thickness:2px;text-underline-offset:4px}
    .content-page img{max-width:100%;height:auto;border-radius:12px}
    .content-page blockquote{margin:28px 0;padding:10px 22px;border-left:4px solid var(--yellow);color:#756b88;font:700 2rem/1.1 var(--caveat)}
    .post-list{display:grid;gap:10px}
    .post-row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:2px dashed var(--line);text-decoration:none;transition:transform .25s,color .25s}
    .post-row span:first-child{font:700 1.9rem/1 var(--caveat)}
    .post-row span:last-child{font:1.2rem var(--hand);color:var(--muted);white-space:nowrap}
    .post-row:hover{transform:translateX(5px);color:var(--coral-dark)}
    footer{border-top:2px dashed var(--line);max-width:1104px;margin:0 auto;padding:22px 28px 36px;display:flex;justify-content:space-between;gap:18px;color:var(--muted);font:1.25rem var(--caveat)}
    .footer-mark{color:var(--coral-dark)}
    .reveal{opacity:1;transform:none}
    .scroll-buddy{position:fixed;right:19px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
    .buddy-label,.buddy-caption{writing-mode:vertical-rl;font:600 1.05rem var(--caveat);color:#897d9c;letter-spacing:.04em}
    .buddy-track{position:relative;width:7px;height:36vh;min-height:190px;max-height:390px;border-radius:99px;background:#eadfce;box-shadow:inset 0 0 0 1px rgba(64,59,80,.05)}
    .buddy-fill{position:absolute;left:0;top:0;width:100%;height:var(--scroll-progress,0%);border-radius:99px;background:linear-gradient(#f4c96c,#ef8e78,#c9b7e8)}
    .buddy-marker{position:absolute;left:50%;top:var(--scroll-progress,0%);transform:translate(-50%,-50%);font-size:25px;line-height:1;color:var(--coral-dark);text-shadow:0 2px 0 #fff8e9;transition:top .12s linear;animation:marker-wiggle 2.8s ease-in-out infinite}
    .reading-progress{display:none}
    .back-top{position:fixed;right:58px;bottom:22px;z-index:35;width:46px;height:46px;border:2px solid #e8d7c2;border-radius:16px;background:#fffdf6;color:var(--coral-dark);font:700 1.8rem var(--caveat);box-shadow:3px 4px 0 #e7d9c8;opacity:0;pointer-events:none;transform:translateY(8px) rotate(-5deg);transition:opacity .25s,transform .25s;cursor:pointer}
    .back-top.show{opacity:1;pointer-events:auto;transform:none}
    @keyframes book-float{0%,100%{translate:0 0}50%{translate:0 -12px}}
    @keyframes paper-wiggle{0%,100%{transform:translate(35px,15px) rotate(8deg)}50%{transform:translate(28px,5px) rotate(5deg)}}
    @keyframes glow-breathe{0%,100%{opacity:.65;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes shadow-breathe{0%,100%{transform:scaleX(1) rotate(-8deg);opacity:.8}50%{transform:scaleX(.82) rotate(-8deg);opacity:.45}}
    @keyframes note-bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -9px;rotate:2deg}}
    @keyframes paper-bob{0%,100%{translate:0 0}50%{translate:0 -15px}}
    @keyframes marker-wiggle{0%,100%{rotate:-8deg}50%{rotate:8deg}}
    @media(max-width:760px){
      html{scroll-padding-top:78px}
      .nav{padding:10px 17px}.menu-toggle{display:block}.navlinks{display:none;position:absolute;top:62px;left:0;right:0;background:var(--paper);padding:16px 20px 20px;border-bottom:2px dashed var(--line);flex-direction:column;align-items:flex-start;gap:13px}.navlinks.open{display:flex}.navlinks a{font-size:1.55rem}
      main{padding:28px 24px 62px 17px}.journal-hero{grid-template-columns:1fr;gap:2px;padding:20px 0 40px;min-height:0}.hero-copy h1{font-size:clamp(3.6rem,14vw,5rem);max-width:100%}.hero-lede{font-size:1.2rem}.hero-meta{font-size:1.2rem;margin-top:18px}.book-stage{height:350px;margin-top:8px;max-width:100%;overflow:visible}.book{transform:scale(.82) rotateY(-22deg) rotateZ(-4deg)}.book-stage:hover .book{transform:scale(.84) rotateY(-9deg) rotateX(5deg) rotateZ(-1deg) translateY(-8px)}.floating-note{right:0;top:7%;font-size:1.05rem;padding:10px 12px}.floating-note strong{font-size:1.5rem}.handwritten-note{left:0;bottom:7%;font-size:1.8rem}.paper-orbit.one{right:1%;bottom:7%}.paper-orbit.two{left:2%;top:5%}
      .entries{grid-template-columns:1fr;gap:15px}.entry{min-height:0;padding:20px 18px 25px}.entry h3{font-size:2rem}.section-head{align-items:center;gap:10px}.section-head h2{font-size:2.5rem}.text-link{font-size:1.25rem}.content-page{margin:10px 0 0;padding:22px 18px;box-shadow:5px 6px 0 rgba(201,183,232,.25)}.content-page>h1{font-size:clamp(3.5rem,14vw,5rem)}.content-page p,.content-page li{font-size:1.18rem}.post-row{align-items:flex-start;gap:8px}.post-row span:first-child{font-size:1.6rem}.post-row span:last-child{font-size:1rem}footer{padding:18px 18px 28px;flex-direction:column;gap:4px;font-size:1.15rem}
      .scroll-buddy{right:5px;gap:5px}.buddy-label,.buddy-caption{display:none}.buddy-track{height:25vh;min-height:135px;width:5px}.buddy-marker{font-size:20px}.back-top{right:15px;bottom:14px}
    }
    @media(max-width:380px){main{padding-left:14px;padding-right:22px}.hero-copy h1{font-size:3.35rem}.book-stage{height:310px}.book{transform:scale(.72) rotateY(-22deg) rotateZ(-4deg)}.book-stage:hover .book{transform:scale(.74) rotateY(-9deg) rotateX(5deg) rotateZ(-1deg)}.floating-note{font-size:.95rem}.handwritten-note{font-size:1.55rem}.section-head h2{font-size:2.15rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  
    /* The diary's opening sequence */
    body.home-intro main,body.home-intro .topbar,body.home-intro footer,body.home-intro .scroll-buddy{opacity:0;visibility:hidden}
    body.home-intro main{transform:translateY(18px) scale(.99)}
    .diary-intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fffdf5 0%,#fff7e8 55%,#f5e8d7 100%);transition:opacity .9s ease,visibility .9s ease}
    .diary-intro:before{content:"";position:absolute;inset:0;opacity:.45;background-image:radial-gradient(#ddcdb9 .8px,transparent .8px);background-size:18px 18px}
    .intro-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
    .intro-whisper{font:600 clamp(1.45rem,3vw,2rem)/1.1 var(--caveat);color:#8a7898;opacity:0;transform:translateY(8px);animation:intro-whisper-in .8s .45s forwards}
    .intro-book-scene{width:min(76vw,330px);height:min(92vw,420px);max-height:55vh;min-height:275px;perspective:1400px;position:relative;display:grid;place-items:center}
    .intro-book-shadow{position:absolute;bottom:4%;width:78%;height:9%;border-radius:50%;background:rgba(64,59,80,.2);filter:blur(18px);animation:intro-shadow 3.8s ease-in-out infinite}
    .intro-book{position:relative;width:76%;height:86%;transform-style:preserve-3d;transform:rotateY(-13deg) rotateZ(-2deg);animation:intro-book-arrive 1s .15s both}
    .intro-book-pages{position:absolute;inset:4px 0 0 7px;border-radius:4px 13px 13px 4px;background:repeating-linear-gradient(90deg,#fffdf7 0,#fffdf7 2px,#e8ddce 3px,#fffdf7 4px);box-shadow:8px 10px 20px rgba(64,59,80,.12);transform:translateZ(-5px)}
    .intro-page{position:absolute;inset:5px 2px 5px 8px;border-radius:4px 12px 12px 4px;background:#fffdf6;border:1px solid #eadfce;transform-origin:left center;transform-style:preserve-3d;box-shadow:2px 3px 7px rgba(64,59,80,.08)}
    .intro-page:after{content:"";position:absolute;inset:12% 12%;border-top:2px dashed #e8daca;opacity:.8}
    .intro-page.page-a{animation:intro-page-turn 1s 1.25s cubic-bezier(.55,.05,.3,1) both}
    .intro-page.page-b{animation:intro-page-turn 1s 1.65s cubic-bezier(.55,.05,.3,1) both}
    .intro-page.page-c{animation:intro-page-turn 1s 2.05s cubic-bezier(.55,.05,.3,1) both}
    .intro-cover{position:absolute;inset:0;border-radius:5px 14px 14px 5px;transform-origin:left center;transform-style:preserve-3d;background:linear-gradient(145deg,#f2a18a,#d97569 72%);box-shadow:inset 7px 0 10px rgba(255,255,255,.22),inset -5px 0 10px rgba(100,40,40,.1),12px 18px 28px rgba(64,59,80,.2);color:#fff9ed;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:12% 10%;animation:intro-cover-open 1.3s 2.4s cubic-bezier(.65,.05,.25,1) forwards}
    .intro-cover:before{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,249,237,.58);border-radius:9px}
    .intro-cover:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(90,40,40,.2),transparent 14%,transparent 80%,rgba(255,255,255,.14));backface-visibility:hidden}
    .intro-cover-back{position:absolute;inset:0;border-radius:5px 14px 14px 5px;background:#d7b9a5;transform:rotateY(180deg) translateZ(1px);backface-visibility:hidden}
    .intro-cover small{font:600 clamp(.85rem,2vw,1.05rem) var(--caveat);letter-spacing:.06em;position:relative}
    .intro-cover strong{font:700 clamp(2.5rem,7vw,3.8rem)/.88 var(--caveat);max-width:220px;position:relative}
    .intro-cover span{font:600 1.15rem var(--caveat);position:relative}
    .intro-pages-note{position:absolute;z-index:4;bottom:10%;font:600 1.2rem var(--caveat);color:#9b8291;opacity:0;animation:intro-whisper-in .6s 2.6s forwards}
    .intro-skip{border:1.5px solid #e4d4c2;background:rgba(255,253,246,.78);border-radius:99px;padding:8px 18px;color:#80758d;font:600 1.2rem var(--caveat);cursor:pointer;opacity:0;animation:intro-whisper-in .6s 1s forwards;transition:background .2s,transform .2s}
    .intro-skip:hover{background:#fff;transform:translateY(-2px)}
    .diary-intro.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    body.home-intro main,body.home-intro .topbar,body.home-intro footer,body.home-intro .scroll-buddy{transition:opacity .9s ease,transform .9s ease,visibility .9s}
    body.home-intro.is-revealed main,body.home-intro.is-revealed .topbar,body.home-intro.is-revealed footer,body.home-intro.is-revealed .scroll-buddy{opacity:1;visibility:visible}
    body.home-intro.is-revealed main{transform:none}
    @keyframes intro-book-arrive{from{opacity:0;transform:translateY(28px) rotateY(-24deg) rotateZ(-5deg) scale(.94)}to{opacity:1;transform:translateY(0) rotateY(-13deg) rotateZ(-2deg) scale(1)}}
    @keyframes intro-cover-open{0%{transform:rotateY(0)}100%{transform:rotateY(-158deg)}}
    @keyframes intro-page-turn{0%{transform:rotateY(0)}100%{transform:rotateY(-175deg)}}
    @keyframes intro-whisper-in{to{opacity:1;transform:translateY(0)}}
    @keyframes intro-shadow{0%,100%{transform:scaleX(1);opacity:.8}50%{transform:scaleX(.82);opacity:.45}}
    @media(max-width:600px){.intro-inner{gap:15px}.intro-book-scene{width:min(78vw,290px);height:min(100vw,360px);min-height:260px}.intro-cover{padding:13% 8%}.intro-cover strong{font-size:2.8rem}.intro-pages-note{bottom:8%}}
    @media(prefers-reduced-motion:reduce){.intro-book,.intro-whisper,.intro-skip,.intro-page,.intro-cover,.intro-pages-note,.intro-book-shadow{animation:none!important}.intro-whisper,.intro-skip{opacity:1;transform:none}.intro-cover{transform:rotateY(-158deg)}.intro-page{transform:rotateY(-175deg)}}


    /* A more tactile, cinematic opening: the book lands, opens, turns, then hands off to the page. */

:root{--paper:#080d1b;--paper2:#101a30;--ink:#f4f5fa;--muted:#aab7d1;--line:rgba(115,158,220,.25);--coral:#ef2447;--coral-dark:#ff3558;--lilac:#56b7ff;--mint:#8bdcff;--sky:#2476c8;--yellow:#f8d66d;--hand:'Barlow Condensed',sans-serif;--caveat:'Bangers',cursive;--sketch:'Bangers',cursive;--spider-red:#e51d3d;--spider-blue:#1676c8}
html{scroll-behavior:smooth;background:#080d1b}
body{background:#080d1b;color:#f4f5fa;font-family:'Barlow Condensed',sans-serif;background-image:radial-gradient(rgba(91,145,209,.16) .7px,transparent .8px);background-size:13px 13px}
body:before{z-index:0;background:linear-gradient(135deg,rgba(8,13,27,.25),rgba(8,13,27,.78));}
body>*{position:relative;z-index:1}
a{color:#f4f5fa}
.topbar{background:rgba(7,12,25,.86);border-bottom:1px solid rgba(72,148,225,.4);box-shadow:0 8px 35px rgba(0,0,0,.3)}
.nav{max-width:1320px}
.brand{font:400 2rem/1 'Bangers',cursive;letter-spacing:1.5px;color:#fff;text-shadow:2px 2px 0 #e51d3d,4px 4px 0 #1676c8;transform:rotate(-2deg)}
.brand span{color:#ff3558}
.navlinks a{font:400 1.35rem/1 'Bangers',cursive;letter-spacing:1.2px;color:#b9c9e4}
.navlinks a:hover,.navlinks a.active{color:#ff4563}
.navlinks a.active:after{background:#1688df;box-shadow:0 0 12px #1688df}
.menu-toggle{background:#101c32;border-color:#31557e;color:#fff}
main{max-width:1320px;padding-top:54px}
h1,h2,h3{font-family:'Bangers',cursive;letter-spacing:1.2px;color:#fff;text-shadow:2px 2px 0 rgba(229,29,61,.35)}
h1{font-size:clamp(3.7rem,8vw,7.2rem);line-height:.92}
h2{font-size:clamp(2.7rem,5vw,4.3rem)}
p{color:#c0cce0}
.page-kicker,.eyebrow{font:400 1.1rem 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#62baff}
.journal-hero{min-height:650px;grid-template-columns:1.05fr .95fr;gap:2%;padding:42px 0 90px}
.journal-hero:before{content:"";position:absolute;inset:-30px -7vw 0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 72% 45%,rgba(18,100,175,.28),transparent 42%),linear-gradient(180deg,transparent 65%,#080d1b 100%)}
.hero-copy{max-width:690px}
.hero-copy h1{max-width:720px;margin:20px 0 25px}
.hero-copy h1 em{color:#ff3558;font-style:normal;text-shadow:3px 3px 0 #1268b2}
.hero-lede{max-width:560px;font:400 clamp(1.2rem,2vw,1.45rem)/1.55 'Barlow Condensed',sans-serif;color:#c6d4e9}
.hero-meta{font:600 1.05rem 'Barlow Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#83c8ff}
.hero-meta:before{background:#e51d3d;box-shadow:0 0 12px #e51d3d}
.handwritten{font:400 2.3rem 'Bangers',cursive;color:#ff4563;letter-spacing:1px}
.book-stage{height:520px;perspective:1300px}
.book-stage:before{width:420px;height:420px;background:radial-gradient(circle,rgba(24,119,202,.35),rgba(229,29,61,.12) 45%,transparent 70%);filter:blur(4px)}
.book-stage:after{width:350px;height:420px;border:1px solid rgba(75,171,245,.5);border-radius:48% 52% 44% 56%;transform:rotate(25deg);box-shadow:0 0 35px rgba(28,137,222,.18),inset 0 0 35px rgba(28,137,222,.08)}
.book{width:290px;height:380px;transform:rotateY(-18deg) rotateZ(-5deg);animation:spider-float 5s ease-in-out infinite}
.book-cover{background:linear-gradient(145deg,#e51d3d,#9c102c 68%,#102b51);border:1px solid rgba(255,255,255,.22);box-shadow:inset 9px 0 14px rgba(255,255,255,.12),inset -8px 0 18px rgba(0,0,0,.24),18px 28px 45px rgba(0,0,0,.5);color:#fff}
.book-cover:before{border:1px solid rgba(255,255,255,.45);border-radius:4px}
.book-label,.book-mark{font:600 .95rem 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#f8dce2}
.book-title{font:400 3.5rem/.9 'Bangers',cursive;letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 #1676c8}
.book-mark{color:#fff}
.book-pages{background:repeating-linear-gradient(90deg,#d8e5f4 0,#d8e5f4 2px,#8da6c5 3px,#eef4fc 4px)}
.book-back{background:#102f55}
.book-spine{background:linear-gradient(90deg,#78142b,#e51d3d,#174c82)}
.book-shadow{background:rgba(0,0,0,.55)}
.floating-note,.handwritten-note,.paper-orbit{display:none}
.section-head{border-top:1px solid rgba(90,151,213,.3);padding-top:28px}
.section-head h2{font:400 3.3rem 'Bangers',cursive;letter-spacing:1.5px}
.text-link{font:400 1.25rem 'Bangers',cursive;letter-spacing:1px;color:#ff4563;border-bottom:2px solid #1676c8}
.entries{gap:22px}
.entry{background:linear-gradient(145deg,rgba(18,34,59,.96),rgba(9,17,32,.98));border:1px solid rgba(77,145,213,.45);border-radius:3px;padding:25px;box-shadow:6px 7px 0 rgba(22,118,200,.22);clip-path:polygon(0 0,96% 0,100% 5%,100% 100%,4% 100%,0 95%)}
.entry:nth-child(3n+2),.entry:nth-child(3n){transform:none}
.entry:hover{background:linear-gradient(145deg,#192e50,#0b172b);transform:translateY(-8px) rotate(-.6deg);box-shadow:10px 15px 0 rgba(229,29,61,.22)}
.entry-date{font:600 1rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#63baff}
.entry h3{font:400 2rem 'Bangers',cursive;letter-spacing:1px}
.entry p{color:#b8c7dd}
.entry:after{color:#e51d3d}
.post-row{border-bottom:1px solid rgba(91,150,211,.28)}
.post-row span:first-child{font:400 1.8rem 'Bangers',cursive;letter-spacing:.8px}
.post-row span:last-child{color:#8da9cb;font:600 1rem 'Barlow Condensed',sans-serif;letter-spacing:.1em}
.content-page{background:linear-gradient(145deg,rgba(17,31,54,.96),rgba(8,15,29,.98));border:1px solid rgba(84,150,216,.4);border-radius:4px;box-shadow:10px 12px 0 rgba(22,118,200,.16);color:#f4f5fa}
.content-page p,.content-page li{color:#c0cce0;font:400 1.25rem/1.65 'Barlow Condensed',sans-serif}
.content-page>h1{font:400 clamp(3.5rem,7vw,6rem)/.92 'Bangers',cursive;color:#fff}
.content-page h2{color:#fff}
.content-page a{color:#ff526b}
.content-page blockquote{border-left:4px solid #e51d3d;color:#a9d8ff}
footer{border-top:1px solid rgba(85,147,211,.3);color:#8ea6c8;font:600 1rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.footer-mark{color:#ff3558}
.scroll-buddy{right:17px}
.buddy-track{background:#172a46;box-shadow:inset 0 0 0 1px rgba(95,160,220,.2)}
.buddy-fill{background:linear-gradient(#1676c8,#e51d3d)}
.buddy-marker{color:#ff3558;text-shadow:0 2px 0 #080d1b}
.back-top{background:#132541;border:1px solid #35618e;color:#fff;box-shadow:3px 4px 0 #e51d3d;border-radius:3px}
.name-loader{background:radial-gradient(ellipse at 50% 42%,#172d4b 0%,#0a1427 58%,#050912 100%)}
.name-loader:before{opacity:.22;background-image:radial-gradient(#5e9bcf .8px,transparent .8px)}
.name-loader-label,.name-loader-caption{color:#a9d8ff}
.name-signature .pen-stroke,.name-signature .underline{stroke:#f4f7ff;filter:drop-shadow(0 0 5px rgba(40,150,255,.45))}
.name-loader-skip{background:#132541;border-color:#35618e;color:#d8e9ff}
.name-signature .i-dot{fill:#fff}
.name-loader-inner:after{content:"EARTH-616 // PERSONAL ARCHIVE";font:600 .7rem 'Barlow Condensed',sans-serif;letter-spacing:.28em;color:#e94a62;opacity:.8}
.spider-atmosphere{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;perspective:900px}
.spider-atmosphere:before{content:"";position:absolute;inset:-20%;opacity:.16;background:repeating-linear-gradient(28deg,transparent 0 70px,rgba(74,152,222,.24) 71px 72px,transparent 73px 145px),repeating-linear-gradient(151deg,transparent 0 90px,rgba(229,29,61,.18) 91px 92px,transparent 93px 180px);mask-image:radial-gradient(ellipse at center,#000 0%,transparent 78%)}
.spider-city{position:absolute;left:-4%;right:-4%;bottom:0;height:34vh;min-height:180px;opacity:.42;display:flex;align-items:end;gap:5px;transform:rotateX(2deg);transform-origin:bottom}
.spider-city i{display:block;flex:1;min-width:12px;background:linear-gradient(180deg,#183a60,#091426);border:1px solid rgba(67,143,207,.22);box-shadow:inset 0 0 20px rgba(33,119,190,.1);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);position:relative}
.spider-city i:after{content:"";position:absolute;inset:10px 4px;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,190,88,.25) 9px 11px,transparent 12px 19px),repeating-linear-gradient(0deg,transparent 0 14px,rgba(255,190,88,.18) 15px 17px,transparent 18px 25px)}
.spider-hud{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;align-items:center;gap:9px}
.web-shooter{width:54px;height:54px;border:1px solid rgba(108,184,244,.65);background:linear-gradient(145deg,#e51d3d,#92142d);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 22px rgba(229,29,61,.25),4px 4px 0 #1268b2;clip-path:polygon(12% 0,88% 0,100% 15%,100% 85%,88% 100%,12% 100%,0 85%,0 15%);transition:transform .2s,filter .2s}
.web-shooter:hover{transform:translateY(-4px) scale(1.06);filter:brightness(1.2)}
.web-shooter svg{width:29px;height:29px}
.web-shooter-label{font:600 .75rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:#c8ddf5;text-transform:uppercase;text-shadow:0 2px 5px #000}
.web-burst{position:fixed;z-index:95;pointer-events:none;inset:0;overflow:hidden}
.web-burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.web-burst path{fill:none;stroke:#d9f0ff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;filter:drop-shadow(0 0 5px #1688df);animation:web-fire .55s cubic-bezier(.2,.8,.2,1) forwards}
.web-burst .impact{fill:#fff;stroke:#65c7ff;stroke-width:2;opacity:0;animation:web-impact .45s .42s ease-out forwards}
@keyframes web-fire{to{stroke-dashoffset:0;opacity:0}}
@keyframes web-impact{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
@keyframes spider-float{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -15px;rotate:1deg}}
@keyframes city-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
body.spider-web-hit .web-shooter{animation:web-recoil .22s ease}
@keyframes web-recoil{50%{transform:translate(-4px,3px) rotate(-8deg) scale(.94)}}
@media(max-width:760px){
 main{padding:30px 18px 70px 14px}
 .journal-hero{grid-template-columns:1fr;min-height:0;padding:35px 0 60px;gap:0}
 .book-stage{height:390px;margin-top:8px}
 .book{transform:scale(.86) rotateY(-18deg) rotateZ(-5deg)}
 .book-stage:hover .book{transform:scale(.88) rotateY(-9deg) rotateX(5deg) rotateZ(-1deg) translateY(-8px)}
 .entries{grid-template-columns:1fr}
 .entry{clip-path:none}
 .navlinks{background:#091426;border-bottom:1px solid #31557e}
 .web-shooter-label{display:none}
 .spider-hud{right:14px;bottom:16px}
 .spider-city{height:23vh;min-height:125px}
}
@media(prefers-reduced-motion:reduce){
 .book,.spider-city{animation:none!important}
 .web-burst{display:none}
}

  

/* Spider-Verse treatment for the existing name intro */
.diary-intro{background:radial-gradient(ellipse at 50% 42%,#172d4b 0%,#0a1427 58%,#050912 100%)!important;color:#f5f8ff}
.diary-intro:before{opacity:.24!important;background-image:radial-gradient(#72bfff .8px,transparent .8px)!important}
.intro-whisper{color:#9bd6ff!important;font:600 clamp(1rem,2.5vw,1.4rem) 'Barlow Condensed',sans-serif!important;letter-spacing:.2em;text-transform:uppercase}
.intro-cover{background:linear-gradient(145deg,#e51d3d,#9c102c 68%,#102b51)!important;box-shadow:inset 7px 0 10px rgba(255,255,255,.16),inset -5px 0 10px rgba(0,0,0,.22),12px 18px 28px rgba(0,0,0,.45)!important}
.intro-cover:before{border:1px solid rgba(255,255,255,.55)!important}
.intro-cover *{color:#fff!important}
.intro-page{background:#eaf2fb!important;border-color:#7f9fbe!important}
.intro-book-shadow{background:rgba(0,0,0,.5)!important}

/* ===== SPIDER-VERSE POWER-UP: character, swinging, webbed cursor ===== */
:root{cursor:crosshair}
body{cursor:none!important}
a,button,input,textarea,select,[role="button"]{cursor:none!important}
.spider-verse-cursor{position:fixed;left:0;top:0;width:44px;height:44px;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:width .16s,height .16s}
.spider-verse-cursor svg{width:100%;height:100%;filter:drop-shadow(0 0 7px rgba(76,183,255,.85))}
.spider-verse-cursor.is-hot{width:62px;height:62px}
.spider-verse-cursor.is-hot svg{filter:drop-shadow(0 0 9px rgba(255,35,75,.95))}
.spider-verse-cursor .cursor-ring{transform-origin:center;animation:cursor-spin 5s linear infinite}
@keyframes cursor-spin{to{transform:rotate(360deg)}}
.spider-swing-stage{position:fixed;inset:0;z-index:85;pointer-events:none;overflow:hidden}
.spider-swinger{position:absolute;top:-5vh;left:-22vw;width:clamp(115px,17vw,245px);height:auto;transform-origin:50% 0;filter:drop-shadow(0 12px 15px rgba(0,0,0,.5));animation:hero-swing-across 12s cubic-bezier(.45,.02,.55,.98) infinite;opacity:.98}
.spider-swinger svg{display:block;width:100%;height:auto;overflow:visible}
.spider-swinger .swing-web{stroke:#d8f4ff;stroke-width:2.2;fill:none;filter:drop-shadow(0 0 5px #36aaff)}
.spider-swinger .suit-red{fill:#d9193d;stroke:#ff637a;stroke-width:1.5}
.spider-swinger .suit-blue{fill:#103f79;stroke:#49a9f4;stroke-width:1.5}
.spider-swinger .web-lines{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1}
.spider-swinger .eye{fill:#f5fbff;stroke:#071528;stroke-width:2}
@keyframes hero-swing-across{
  0%{left:-22vw;top:-9vh;transform:rotate(-28deg) scale(.78)}
  12%{left:8vw;top:4vh;transform:rotate(18deg) scale(1)}
  27%{left:31vw;top:19vh;transform:rotate(38deg) scale(1.05)}
  43%{left:53vw;top:2vh;transform:rotate(-16deg) scale(.92)}
  59%{left:74vw;top:17vh;transform:rotate(28deg) scale(1.02)}
  76%{left:103vw;top:-5vh;transform:rotate(52deg) scale(.85)}
  100%{left:125vw;top:-12vh;transform:rotate(62deg) scale(.72)}
}
.spider-swinger:before{content:"";position:absolute;left:48%;bottom:80%;height:58vh;width:2px;background:linear-gradient(to top,rgba(220,245,255,.8),rgba(70,166,239,.08));transform:rotate(-7deg);transform-origin:bottom;filter:drop-shadow(0 0 5px #37aaff)}
.spider-swinger:after{content:"";position:absolute;left:48%;top:20%;width:150%;height:1px;background:linear-gradient(90deg,transparent,rgba(229,29,61,.75),transparent);animation:swing-trail .65s ease-in-out infinite}
@keyframes swing-trail{50%{transform:translateX(18px);opacity:.25}}
.web-shooter-dock{position:fixed;right:20px;bottom:22px;z-index:120;display:flex;align-items:center;gap:10px}
.web-shooter-label{font:700 .72rem 'Barlow Condensed',sans-serif;letter-spacing:.18em;color:#d9eaff;text-transform:uppercase;text-shadow:0 2px 8px #000}
.web-shooter{position:relative;width:62px;height:62px;border:1px solid rgba(163,219,255,.8);background:linear-gradient(145deg,#f52c4e,#94132d 72%);color:#fff;display:grid;place-items:center;cursor:none!important;box-shadow:0 0 24px rgba(229,29,61,.42),0 0 0 4px rgba(22,118,200,.28),5px 6px 0 #0c4d89;clip-path:polygon(14% 0,86% 0,100% 16%,100% 84%,86% 100%,14% 100%,0 84%,0 16%);transition:transform .2s,filter .2s}
.web-shooter:before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.35);clip-path:inherit}
.web-shooter:hover{transform:translateY(-5px) rotate(-7deg) scale(1.08);filter:brightness(1.22)}
.web-shooter svg{width:34px;height:34px}
.web-shot-layer{position:fixed;inset:0;z-index:115;pointer-events:none;overflow:hidden}
.web-shot-layer svg{position:absolute;inset:0;width:100%;height:100%}
.web-shot-layer path{fill:none;stroke:#e6f7ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1600;stroke-dashoffset:1600;filter:drop-shadow(0 0 6px #2da7ff);animation:web-shot-draw .62s cubic-bezier(.2,.7,.2,1) forwards}
.web-shot-layer circle{fill:#fff;stroke:#4ebdff;stroke-width:2;transform-origin:center;animation:web-shot-pop .48s .38s ease-out both}
@keyframes web-shot-draw{to{stroke-dashoffset:0;opacity:0}}
@keyframes web-shot-pop{0%{opacity:0;transform:scale(.1)}40%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
.web-thread{position:fixed;z-index:2;pointer-events:none;top:0;left:0;width:100%;height:100%;opacity:.13}
.web-thread svg{width:100%;height:100%}
.web-thread path{fill:none;stroke:#72bfff;stroke-width:1;vector-effect:non-scaling-stroke}
.web-action{position:relative}
.web-action:after{content:"";position:absolute;inset:-5px;border:1px solid rgba(92,190,255,.0);transform:scale(.88);transition:.25s;pointer-events:none}
.web-action:hover:after{border-color:rgba(92,190,255,.8);transform:scale(1.06);box-shadow:0 0 18px rgba(40,150,255,.18)}
.spider-character-card{position:absolute;right:3%;bottom:4%;width:clamp(120px,17vw,230px);z-index:3;pointer-events:none;filter:drop-shadow(0 18px 20px rgba(0,0,0,.55));animation:character-hover 4.2s ease-in-out infinite}
.spider-character-card svg{width:100%;height:auto}
@keyframes character-hover{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-16px) rotate(-3deg)}}
.journal-hero{overflow:visible}
.journal-hero .hero-copy{z-index:4}
.journal-hero .book-stage{z-index:2}
.journal-hero .book-stage:after{border:1px solid rgba(87,180,255,.8);box-shadow:0 0 30px rgba(28,137,222,.2)}
.web-mission:before{content:"✦";position:absolute;right:18px;top:12px;color:rgba(255,255,255,.18);font:1.5rem 'Bangers',cursive}
.entry,.web-mission,.content-page,.library-book,.journal-form button{position:relative}
.entry:before,.content-page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(135deg,transparent 0 18px,rgba(90,174,255,.12) 19px 20px)}
body.web-fired .web-shooter{animation:shooter-recoil .22s ease}
@keyframes shooter-recoil{50%{transform:translate(-5px,4px) rotate(-12deg) scale(.9)}}
@media(max-width:760px){
 body{cursor:auto!important}a,button,input,textarea,select,[role="button"]{cursor:pointer!important}
 .spider-verse-cursor{display:none}
 .spider-swinger{width:125px;animation-duration:15s;opacity:.85}
 .web-shooter-dock{right:13px;bottom:15px}.web-shooter{width:55px;height:55px}
 .spider-character-card{right:0;bottom:1%;width:112px}
}
@media(prefers-reduced-motion:reduce){
 .spider-swinger,.spider-character-card{animation:none!important}
 .web-shot-layer{display:none}
}


/* Midnight comic-city backdrop */
html,body{background:#050b18!important}
body{color:#eaf4ff!important;background-image:radial-gradient(ellipse at 76% 12%,rgba(13,87,151,.25),transparent 34%),radial-gradient(ellipse at 12% 75%,rgba(148,17,44,.15),transparent 30%),linear-gradient(180deg,#071426 0%,#050b18 58%,#091629 100%)!important;background-attachment:fixed!important}
body:before{z-index:0!important;opacity:.2!important;background-image:radial-gradient(rgba(105,185,255,.42) .7px,transparent .8px)!important;background-size:19px 19px!important}
main,header,footer,.scroll-buddy,.back-top{position:relative;z-index:3}
.topbar{background:rgba(4,12,25,.9)!important;border-bottom:1px solid rgba(81,166,235,.28)!important}
.brand{color:#f4f8ff!important;font-family:'Bangers',cursive!important;letter-spacing:1px}
.brand span{color:#f02c4c!important}
.navlinks a{color:#b8cce2!important;font-family:'Barlow Condensed',sans-serif!important;text-transform:uppercase;letter-spacing:.08em}
.navlinks a:hover,.navlinks a.active{color:#fff!important}
.navlinks a.active:after{background:#e72b4a!important}
main{isolation:isolate}
footer{border-color:rgba(93,161,219,.25)!important;color:#9bb5d1!important}
footer .footer-mark{color:#f02c4c!important}
.buddy-label,.buddy-caption{color:#83bce9!important}
.buddy-track{background:rgba(76,139,190,.2)!important}
.buddy-fill{background:linear-gradient(#e52a4b,#2d9fe8)!important}
.buddy-marker{color:#f02c4c!important}
.back-top{background:#0c2340!important;color:#fff!important;border-color:#278bd0!important;box-shadow:3px 4px 0 #8d1730!important}
/* One real swinging character crosses every page. */
.spider-swing-stage{display:none!important}
.web-swing-across{position:fixed;z-index:8;inset:0;pointer-events:none;overflow:hidden}
.swing-rope:before{content:"";position:absolute;left:var(--rope-x,18%);top:0;width:2px;height:34vh;background:linear-gradient(#e7f7ff,rgba(116,203,255,.85),transparent);transform-origin:top center;filter:drop-shadow(0 0 4px #53baff);animation:rope-travel 13s cubic-bezier(.45,0,.55,1) infinite}
.swing-body{position:absolute;left:-190px;top:13vh;width:178px;height:210px;transform-origin:50% 0;animation:spider-cross-city 13s cubic-bezier(.45,0,.55,1) infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.swing-body img{width:100%;height:100%;object-fit:contain;transform:rotate(12deg);animation:spider-swing-pose 13s ease-in-out infinite}
@keyframes spider-cross-city{0%{left:-190px;top:13vh;transform:rotate(-28deg)}12%{left:12vw;top:30vh;transform:rotate(8deg)}25%{left:35vw;top:55vh;transform:rotate(28deg)}38%{left:57vw;top:32vh;transform:rotate(-8deg)}52%{left:78vw;top:12vh;transform:rotate(-32deg)}64%{left:calc(100vw + 20px);top:34vh;transform:rotate(-8deg)}65%,100%{left:calc(100vw + 20px);top:34vh;transform:rotate(0)}}
@keyframes spider-swing-pose{0%,100%{transform:rotate(16deg) scale(.92)}25%{transform:rotate(-18deg) scale(1.03)}52%{transform:rotate(20deg) scale(.96)}}
@keyframes rope-travel{0%,100%{left:-4%;height:32vh;transform:rotate(-24deg)}25%{left:35%;height:45vh;transform:rotate(12deg)}52%{left:79%;height:30vh;transform:rotate(-26deg)}65%{left:104%;height:30vh;opacity:0}}
@media(max-width:760px){.swing-body{width:116px;height:142px;animation-duration:16s}.swing-rope:before{animation-duration:16s}}
@media(prefers-reduced-motion:reduce){.web-swing-across{display:none!important}}


/* Clean, cinematic Spider-Verse polish */
:root{--spider-red:#ff3154;--spider-blue:#73caff}
html,body{max-width:100%;overflow-x:clip}
.nav{width:min(100%,1240px);padding-inline:clamp(18px,4vw,48px);gap:clamp(12px,2vw,28px)}
.brand{white-space:nowrap;font-size:clamp(1.55rem,2.5vw,2.15rem)}
.navlinks{gap:clamp(12px,2vw,28px);flex-shrink:0}
.navlinks a{white-space:nowrap;font-size:clamp(1rem,1.55vw,1.35rem)}
@media(max-width:900px){.nav{padding-inline:20px}.navlinks{gap:12px}.navlinks a{font-size:1.05rem}}
@media(max-width:760px){.navlinks{gap:13px}.navlinks a{font-size:1.45rem}}
/* One hero on the homepage; the city-swing pass stays on inner pages */
body:has(.journal-hero) .web-swing-across{display:none!important}
.spider-atmosphere{opacity:.72}
.web-thread{opacity:.12!important}
.spider-city{opacity:.42!important}
.journal-hero{max-width:1160px;margin-inline:auto;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(12px,3vw,42px);min-height:clamp(500px,68vh,690px);padding:clamp(28px,5vw,64px) 0 70px;overflow:visible}
.hero-copy{max-width:590px}
.hero-copy h1{font-size:clamp(3.6rem,6.8vw,6.5rem);line-height:.91;letter-spacing:-.025em;text-wrap:balance}
.hero-lede{max-width:490px;font-size:clamp(1.05rem,1.5vw,1.25rem);color:#c4d3e7;line-height:1.65}
.hero-meta{font-size:clamp(.9rem,1.2vw,1.1rem);letter-spacing:.12em;color:#8bcfff}
.handwritten{color:#ff4967;text-shadow:3px 3px 0 rgba(28,130,220,.35)}
.real-spider-stage{position:relative;min-height:clamp(420px,54vw,590px);display:grid;place-items:center;overflow:visible;perspective:1100px}
.real-spider-stage:before{content:"";position:absolute;width:min(90%,470px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(27,132,218,.32),rgba(229,29,61,.12) 48%,transparent 72%);filter:blur(5px);z-index:0}
.real-spider-stage:after{content:"";position:absolute;bottom:8%;width:55%;height:28px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(22px);animation:hero-shadow 4.8s ease-in-out infinite}
.hero-spider-3d{position:relative;z-index:2;width:min(100%,510px);height:auto;max-height:560px;object-fit:contain;filter:drop-shadow(0 24px 22px rgba(0,0,0,.48)) drop-shadow(0 0 24px rgba(49,155,255,.16));transform-style:preserve-3d;animation:hero-spider-levitate 5.4s ease-in-out infinite;will-change:transform}
.spider-web-halo{width:min(88%,450px);opacity:.72}
.spider-caption{right:2%;bottom:5%;transform:rotate(-2deg) translateZ(35px)}
@keyframes hero-spider-levitate{0%,100%{transform:translate3d(0,5px,0) rotateY(-7deg) rotateZ(-1deg) scale(1);filter:drop-shadow(0 24px 22px rgba(0,0,0,.48)) drop-shadow(0 0 20px rgba(49,155,255,.15))}50%{transform:translate3d(0,-17px,35px) rotateY(8deg) rotateZ(2deg) scale(1.035);filter:drop-shadow(0 34px 25px rgba(0,0,0,.55)) drop-shadow(0 0 32px rgba(49,155,255,.28))}}
@keyframes hero-shadow{0%,100%{transform:scaleX(1);opacity:.7}50%{transform:scaleX(.76);opacity:.42}}
@media(max-width:760px){.journal-hero{grid-template-columns:1fr;gap:0;min-height:0;padding:35px 0 48px}.hero-copy h1{font-size:clamp(3.5rem,14vw,5.4rem)}.real-spider-stage{min-height:390px;margin-top:10px}.hero-spider-3d{width:min(90%,380px);max-height:410px}.spider-caption{right:3%;bottom:3%}}
@media(prefers-reduced-motion:reduce){.hero-spider-3d,.real-spider-stage:after{animation:none!important}}


/* Swing animation temporarily disabled site-wide */
.web-swing-across,.swing-rope,.swing-body{display:none!important;animation:none!important}

/* Comic-panel page transitions */
body.page-arriving main{animation:comic-page-arrive .62s cubic-bezier(.2,.8,.2,1) both}
body.page-arriving .topbar,body.page-arriving footer{animation:chrome-arrive .48s ease both}
body.page-leaving:before{content:"";position:fixed;inset:0;z-index:300;background:linear-gradient(112deg,transparent 0 34%,rgba(229,29,61,.94) 34.5% 39%,#07182d 39.5% 60%,rgba(62,169,255,.92) 60.5% 65%,transparent 65.5%);transform:translateX(-110%);animation:comic-web-wipe .34s cubic-bezier(.7,0,.25,1) forwards;pointer-events:none}
@keyframes comic-web-wipe{to{transform:translateX(110%)}}
@keyframes comic-page-arrive{0%{opacity:0;transform:translateX(28px) scale(.985);filter:blur(3px)}65%{opacity:1;transform:translateX(-3px) scale(1.003);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes chrome-arrive{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* Web-shooter gauntlet and responsive impact */
.web-shooter-dock{gap:8px}
.web-shooter{width:76px;height:76px;clip-path:none;border:0;background:transparent;box-shadow:none;filter:drop-shadow(0 8px 7px rgba(0,0,0,.55));overflow:visible}
.web-shooter:before{display:none}
.web-shooter svg{width:100%;height:100%;overflow:visible}
.web-shooter:hover{transform:translateY(-4px) rotate(-5deg) scale(1.08);filter:drop-shadow(0 10px 12px rgba(30,150,255,.38))}
.web-shooter:active{transform:translateY(3px) scale(.9);filter:brightness(1.3)}
.web-shooter-dock.is-firing .web-shooter{animation:gauntlet-fire .24s ease}
@keyframes gauntlet-fire{0%,100%{transform:translate(0,0) rotate(0)}35%{transform:translate(-7px,5px) rotate(-13deg) scale(.91)}65%{transform:translate(2px,-2px) rotate(5deg) scale(1.04)}}
.web-shot-layer path{stroke-width:3.2;stroke-dasharray:1800;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #36baff)}
.web-shot-layer circle{filter:drop-shadow(0 0 9px #48baff)}
@media(max-width:760px){.web-shooter{width:65px;height:65px}.web-shooter-label{display:none}}
@media(prefers-reduced-motion:reduce){body.page-arriving main,body.page-arriving .topbar,body.page-arriving footer,body.page-leaving:before{animation:none!important}}

<body>

<script>




  const nameLoader=document.getElementById('name-loader');
  if(nameLoader){
    document.body.classList.add('name-intro');
    let loaderFinished=false;
    const finishNameLoader=()=>{
      if(loaderFinished)return;
      loaderFinished=true;
      nameLoader.classList.add('is-leaving');
      document.body.classList.add('is-revealed');
      window.setTimeout(()=>{
        nameLoader.remove();
        document.body.classList.remove('name-intro','is-revealed');
        document.body.style.overflow='';
      },720);
    };
    const skipNameLoader=document.getElementById('name-loader-skip');
    if(skipNameLoader)skipNameLoader.addEventListener('click',finishNameLoader);
    const nameIntroDuration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?900:6400;
    window.setTimeout(finishNameLoader,nameIntroDuration);
  }

  if(!reducedMotionForArrival())document.body.classList.add('page-arriving');
  function reducedMotionForArrival(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
  window.setTimeout(()=>document.body.classList.remove('page-arriving'),750);

  const menuButton=document.querySelector('.menu-toggle');
  const nav=document.querySelector('.navlinks');
  if(menuButton&&nav)menuButton.addEventListener('click',()=>{const open=nav.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open));});
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const buddy=document.querySelector('.scroll-buddy');
  const backTop=document.querySelector('.back-top');
  let ticking=false;
  const updateScroll=()=>{const max=document.documentElement.scrollHeight-window.innerHeight;const amount=max>0?Math.min(1,Math.max(0,window.scrollY/max)):0;document.documentElement.style.setProperty('--scroll-progress',(amount*100)+'%');if(backTop)backTop.classList.toggle('show',window.scrollY>450);ticking=false;};
  window.addEventListener('scroll',()=>{if(!ticking){window.requestAnimationFrame(updateScroll);ticking=true;}},{passive:true});
  window.addEventListener('resize',updateScroll);
  updateScroll();
  if(backTop)backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:reduced?'auto':'smooth'}));



  // Floating handwritten doodles make the long page feel connected.
  const ambient=document.createElement('div');
  ambient.className='ambient-layer';
  ambient.setAttribute('aria-hidden','true');
  ambient.innerHTML='<span class="ambient-doodle">✳</span><span class="ambient-doodle">♡</span><span class="ambient-doodle">✿</span><span class="ambient-doodle">✧</span><span class="ambient-doodle">·</span>';
  const mainContent=document.querySelector('main');
  if(mainContent)mainContent.prepend(ambient);

  // Reveal major sections gently as they enter the viewport.
  const revealTargets=document.querySelectorAll('main > *, .section-head, .entry, .shelf-card, .post-row, footer');
  if(!reduced && 'IntersectionObserver' in window){
    const revealObserver=new IntersectionObserver(items=>{
      items.forEach(item=>{
        if(item.isIntersecting){item.target.classList.add('motion-visible');revealObserver.unobserve(item.target);}
      });
    },{threshold:.12,rootMargin:'0px 0px -35px 0px'});
    revealTargets.forEach((el,index)=>{
      el.classList.add('motion-reveal');
      el.style.transitionDelay=(Math.min(index%4,3)*65)+'ms';
      revealObserver.observe(el);
    });
  }else{revealTargets.forEach(el=>el.classList.add('motion-visible'));}
  // Pointer-based 3D tilt is deliberately subtle and only runs on desktop.
  if(window.matchMedia('(hover:hover) and (pointer:fine)').matches && !reduced){
    document.querySelectorAll('.entry,.shelf-card,.content-page').forEach(card=>{
      card.addEventListener('pointermove',event=>{
        const r=card.getBoundingClientRect();
        const px=(event.clientX-r.left)/r.width;
        const py=(event.clientY-r.top)/r.height;
        card.style.setProperty('--tilt-x',((.5-py)*7).toFixed(2)+'deg');
        card.style.setProperty('--tilt-y',((px-.5)*8).toFixed(2)+'deg');
        card.classList.add('motion-tilting');
      });
      const reset=()=>{
        card.classList.remove('motion-tilting');
        card.style.removeProperty('--tilt-x');
        card.style.removeProperty('--tilt-y');
      };
      card.addEventListener('pointerleave',reset);
      card.addEventListener('pointercancel',reset);
    });
  }

  // A small pencil follows the pointer and reacts to clicks and interactive elements.
  if(window.matchMedia('(hover: hover) and (pointer: fine)').matches){
    document.body.classList.add('has-custom-cursor');
    const pencil=document.createElement('span');
    pencil.className='pencil-cursor';
    pencil.setAttribute('aria-hidden','true');
    pencil.innerHTML='<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path class="pencil-body" d="M10 27 26 5q2-3 5 0l3 2q3 2 1 5L19 34l-9 2z"/><path class="pencil-tip" d="m10 27 9 7-9 2z"/><path class="pencil-line" d="m26 8 7 5M23 12l7 5M10 27l9 7"/></svg>';
    document.body.appendChild(pencil);
    const bookDialog=document.getElementById('book-dialog');
    if(bookDialog){
      const cursorLayerObserver=new MutationObserver(()=>{
        if(bookDialog.open){
          if(pencil.parentElement!==bookDialog)bookDialog.appendChild(pencil);
        }else if(pencil.parentElement!==document.body){
          document.body.appendChild(pencil);
        }
      });
      cursorLayerObserver.observe(bookDialog,{attributes:true,attributeFilter:['open']});
    }
    window.addEventListener('pointermove',e=>{pencil.style.left=e.clientX+'px';pencil.style.top=e.clientY+'px';},{passive:true});
    document.querySelectorAll('a,button,input,textarea,[role="button"]').forEach(el=>{
      el.addEventListener('pointerenter',()=>document.body.classList.add('cursor-hover'));
      el.addEventListener('pointerleave',()=>document.body.classList.remove('cursor-hover'));
    });
    window.addEventListener('pointerdown',()=>document.body.classList.add('cursor-press'));
    window.addEventListener('pointerup',()=>document.body.classList.remove('cursor-press'));
  }


  // Soft staggered reveals for handwritten notes and individual shelf rows.
  const softTargets=document.querySelectorAll('.note-page > p,.note-page .note-quote,.shelf-row');
  if(!reduced && 'IntersectionObserver' in window){
    const softObserver=new IntersectionObserver(items=>{
      items.forEach(item=>{
        if(item.isIntersecting){item.target.classList.add('is-in');softObserver.unobserve(item.target);}
      });
    },{threshold:.12,rootMargin:'0px 0px -30px 0px'});
    softTargets.forEach((el,index)=>{el.classList.add('soft-reveal');el.style.transitionDelay=(Math.min(index,5)*75)+'ms';softObserver.observe(el);});
  }
  // Gentle 3D response on the individual book spines.
  if(window.matchMedia('(hover:hover) and (pointer:fine)').matches && !reduced){
    document.querySelectorAll('.library-book').forEach(book=>{
      book.addEventListener('pointermove',event=>{
        const r=book.getBoundingClientRect(),x=(event.clientX-r.left)/r.width,y=(event.clientY-r.top)/r.height;
        book.style.setProperty('--book-tilt-x',((.5-y)*5).toFixed(2)+'deg');
        book.style.setProperty('--book-tilt-y',((x-.5)*8).toFixed(2)+'deg');
        book.style.transform='perspective(650px) rotateX('+book.style.getPropertyValue('--book-tilt-x')+') rotateY('+book.style.getPropertyValue('--book-tilt-y')+') translateY(-7px)';
      });
      book.addEventListener('pointerleave',()=>{book.style.removeProperty('transform');book.style.removeProperty('--book-tilt-x');book.style.removeProperty('--book-tilt-y');});
    });
  }

  // Short, soft page-turn transition for internal navigation.
  document.addEventListener('click',event=>{
    const link=event.target.closest('a[href]');
    if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||link.target||link.hasAttribute('download'))return;
    const next=new URL(link.href,window.location.href);
    if(next.origin!==window.location.origin||next.pathname===window.location.pathname||next.hash&&next.pathname===window.location.pathname)return;
    event.preventDefault();
    document.body.classList.add('page-leaving');
    window.setTimeout(()=>{window.location.href=next.href;},330);
  });


/* Spider-Verse interaction controller */
(()=>{
 const layer=document.getElementById('web-shot-layer');
 const cursor=document.getElementById('spider-verse-cursor');
 if(!layer)return;
 let px=innerWidth*.5,py=innerHeight*.5;
 const move=e=>{px=e.clientX;py=e.clientY;if(cursor){cursor.style.left=px+'px';cursor.style.top=py+'px';}};
 window.addEventListener('pointermove',move,{passive:true});
 document.querySelectorAll('a,button,[role="button"]').forEach(el=>{
  el.classList.add('web-action');
  el.addEventListener('pointerenter',()=>cursor&&cursor.classList.add('is-hot'));
  el.addEventListener('pointerleave',()=>cursor&&cursor.classList.remove('is-hot'));
 });
 const shoot=(x,y)=>{
  const dockRect=dock.getBoundingClientRect();
  const sx=dockRect.left+dockRect.width/2,sy=dockRect.top+dockRect.height/2;
  const bend=(Math.random()-.5)*120;
  layer.innerHTML='<svg viewBox="0 0 '+innerWidth+' '+innerHeight+'" preserveAspectRatio="none"><path d="M'+sx+' '+sy+' Q'+((sx+x)/2+bend)+' '+((sy+y)/2-80)+' '+x+' '+y+'"/><circle cx="'+x+'" cy="'+y+'" r="10"/><path class="web-impact" d="M'+(x-15)+' '+y+'l-12 -7m12 7l-7 13m7 -13l13 -9m-13 9l13 10"/></svg>';
  document.body.classList.add('web-fired');
  dock.classList.add('is-firing');
  setTimeout(()=>{layer.innerHTML='';document.body.classList.remove('web-fired');dock.classList.remove('is-firing')},720);
 };
 const dock=document.createElement('div');dock.className='web-shooter-dock';
 dock.innerHTML='<span class="web-shooter-label">WEB SHOOTER · FIRE</span><button class="web-shooter" type="button" aria-label="Fire a web"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><defs><linearGradient id="gauntletRed" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff526b"/><stop offset=".55" stop-color="#d8173d"/><stop offset="1" stop-color="#6e1029"/></linearGradient><linearGradient id="gauntletBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4dbaff"/><stop offset="1" stop-color="#073d78"/></linearGradient></defs><path d="M16 84Q7 78 13 66L27 40Q31 34 36 38L43 45L48 15Q50 7 57 10Q63 12 61 20L57 42L64 12Q67 5 73 9Q79 12 76 20L69 44L78 23Q82 17 87 22Q91 26 87 33L77 55Q87 48 91 54Q95 60 87 68L70 88Q63 96 49 94L27 91Z" fill="url(#gauntletRed)" stroke="#f7dce4" stroke-width="2.2" stroke-linejoin="round"/><path d="M17 75L31 84L49 89L65 83L75 70L67 61L53 69L43 63L35 57L28 66Z" fill="url(#gauntletBlue)" stroke="#9bdcff" stroke-width="1.5"/><path d="M31 42L43 51L53 48L61 42M43 51L38 66M53 48L51 67M64 42L60 59M73 43L66 59" stroke="#071b34" stroke-width="2.3" stroke-linecap="round"/><path d="M47 57L58 51L69 57L65 70L53 75L43 68Z" fill="#071b34" stroke="#9bdcff" stroke-width="1.6"/><path d="M50 62L56 58L62 62L56 68Z" fill="#eafaff"/><path d="M54 57L56 51M61 61L68 57M51 66L45 70" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M50 14L54 4M70 13L77 4M85 25L95 21" stroke="#a8e4ff" stroke-width="2" stroke-linecap="round"/></svg></button>';
