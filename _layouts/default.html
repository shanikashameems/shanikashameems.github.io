<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg-0:#020617;
      --bg-1:#0b1020;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#3b82f6;
      --accent-2:#7c3aed;
    }

    body{
      margin:0;
      font-family:Inter,system-ui,Arial;
      background:radial-gradient(circle at top, #111827 0,#020617 60%);
      color:var(--text);
      min-height:100vh;
    }

    header{
      border-bottom:1px solid rgba(255,255,255,0.05);
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(14px);
      background:rgba(10,15,28,0.75);
    }

    .nav{
      max-width:1100px;
      margin:0 auto;
      padding:16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    header .nav .brand{
      font-weight:600;
      font-size:1.5rem !important;
      line-height:1.1;
      letter-spacing:.015em;
    }

    header .nav .brand span{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      font-weight:900;
    }

    .nav-links a{
      margin-left:26px;
      text-decoration:none;
      font-size:1.02rem;
      font-weight:500;
      color:rgba(255,255,255,0.88);
      transition:0.25s ease;
    }

    .nav-links a:hover{
      color:white;
      text-shadow:0 0 18px rgba(124,58,237,0.95);
    }

    main{
      max-width:1100px;
      margin:0 auto;
      padding:40px 20px 80px;
    }

    footer{
      max-width:1100px;
      margin:50px auto 40px;
      padding:18px;
      text-align:center;
      color:var(--muted);
      font-size:.85rem;
      border-top:1px solid rgba(255,255,255,0.05);
    }

    /* ============================= */
    /* 💬 DE AMOS CHAT STYLING */
    /* ============================= */

    #chat-button{
      position:fixed;
      bottom:22px;
      right:22px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      width:55px;
      height:55px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:22px;
      box-shadow:0 10px 30px rgba(59,130,246,0.35);
      z-index:999;
    }

    #chat-window{
      position:fixed;
      bottom:90px;
      right:22px;
      width:340px;
      background:rgba(15,23,42,0.95);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
      z-index:999;
    }

    .hidden{
      display:none;
    }

    #chat-header{
      padding:14px;
      font-weight:600;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
    }

    #chat-messages{
      padding:14px;
      height:280px;
      overflow-y:auto;
      font-size:14px;
    }

    .chat-user{
      margin-bottom:10px;
      color:#93c5fd;
    }

    .chat-bot{
      margin-bottom:14px;
      color:#e5e7eb;
    }

    #chat-input{
      border:none;
      padding:12px;
      background:#1e293b;
      color:white;
      outline:none;
      font-size:14px;
    }

  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">
      <span>Shanika</span>'s Blog
    </div>

    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about' | relative_url }}">About</a>
      <a href="{{ '/projects' | relative_url }}">Projects</a>
      <a href="{{ '/contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  © {{ site.title }} — Built with GitHub Pages
</footer>

<!-- 💬 Chat Button -->
<div id="chat-button">💬</div>

<!-- 💬 Chat Window -->
<div id="chat-window" class="hidden">
  <div id="chat-header">De Amos</div>
  <div id="chat-messages"></div>
  <input type="text" id="chat-input" placeholder="Ask De Amos something..." />
</div>

<script>
const chatButton = document.getElementById("chat-button");
const chatWindow = document.getElementById("chat-window");
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");

chatButton.onclick = () => {
  chatWindow.classList.toggle("hidden");
};

chatInput.addEventListener("keypress", async (e) => {
  if (e.key === "Enter") {
    const message = chatInput.value.trim();
    if (!message) return;

    chatMessages.innerHTML += `<div class="chat-user"><b>You:</b> ${message}</div>`;
    chatInput.value = "";

    try {
      const response = await fetch("http://localhost:3000/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      chatMessages.innerHTML += `<div class="chat-bot"><b>De Amos:</b> ${data.reply}</div>`;
      chatMessages.scrollTop = chatMessages.scrollHeight;
    } catch (err) {
      chatMessages.innerHTML += `<div class="chat-bot"><b>Error:</b> Backend not reachable.</div>`;
    }
  }
});
</script>

</body>
</html>
