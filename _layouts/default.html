<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | default: site.title }} · Shanika's journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f3f0e9;--paper-2:#e9e4da;--ink:#20231f;--muted:#77786f;--line:rgba(32,35,31,.13);--accent:#9b573e;--accent-soft:#ead9cd;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E")}
    a{color:inherit}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(243,240,233,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .nav{max-width:1160px;margin:auto;padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{text-decoration:none;font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:-.03em}
    .brand span{color:var(--accent);font-style:italic}
    .navlinks{display:flex;align-items:center;gap:28px}
    .navlinks a{text-decoration:none;color:var(--muted);font-size:.83rem;letter-spacing:.02em;transition:color .2s}
    .navlinks a:hover,.navlinks a.active{color:var(--ink)}
    .navlinks a.active:after{content:"";display:block;height:1px;background:var(--accent);margin-top:3px}
    .menu-toggle{display:none;background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;color:var(--ink)}
    main{max-width:1160px;margin:0 auto;padding:54px 28px 100px;min-height:72vh}
    .page-kicker,.eyebrow{font:500 .68rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
    h1,h2,h3{line-height:1.15}
    h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.035em}
    h1{font-size:clamp(2.5rem,6vw,5.1rem)}
    h2{font-size:clamp(1.8rem,3vw,2.6rem)}
    p{color:#62645c}
    .journal-hero{display:grid;grid-template-columns:1.04fr .96fr;gap:7%;align-items:center;min-height:510px;padding:26px 0 70px}
    .hero-copy{position:relative;z-index:2}
    .hero-copy h1{max-width:650px;margin:20px 0 22px}
    .hero-copy h1 em{color:var(--accent);font-weight:500}
    .hero-lede{max-width:500px;font-size:1rem;line-height:1.85}
    .hero-meta{display:flex;align-items:center;gap:18px;margin-top:34px;font: .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .hero-meta:before{content:"";width:40px;height:1px;background:var(--accent)}
    .book-stage{height:440px;display:grid;place-items:center;perspective:1200px;position:relative;isolation:isolate}
    .book-stage:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(155,87,62,.13),transparent 68%);filter:blur(5px);z-index:-1}
    .book-shadow{position:absolute;width:300px;height:55px;bottom:34px;background:rgba(42,35,29,.2);filter:blur(25px);border-radius:50%;transform:rotate(-9deg)}
    .book{position:relative;width:270px;height:350px;transform:rotateY(-23deg) rotateZ(-5deg);transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1);animation:book-arrive 1.2s both}
    .book-stage:hover .book{transform:rotateY(-8deg) rotateZ(-2deg) translateY(-9px)}
    .book-cover{position:absolute;inset:0;border-radius:5px 12px 12px 5px;background:linear-gradient(135deg,#a9694f,#784632 75%);box-shadow:inset 7px 0 9px rgba(255,255,255,.13),inset -5px 0 9px rgba(0,0,0,.15),12px 22px 35px rgba(45,32,25,.25);padding:35px 30px;color:#f6eadb;display:flex;flex-direction:column;justify-content:space-between;transform:translateZ(11px);overflow:hidden}
    .book-cover:before{content:"";position:absolute;inset:12px;border:1px solid rgba(246,234,219,.3);border-radius:2px}
    .book-cover:after{content:"";position:absolute;right:20px;top:0;height:100%;width:1px;background:rgba(255,255,255,.12)}
    .book-label{font: .59rem var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.82}
    .book-title{font:500 2.45rem/1.05 var(--serif);letter-spacing:-.04em;max-width:185px}
    .book-mark{font: .62rem var(--mono);letter-spacing:.15em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
    .book-pages{position:absolute;top:7px;bottom:7px;right:-13px;width:18px;background:repeating-linear-gradient(90deg,#eee8dc 0,#eee8dc 2px,#d7d0c4 3px,#f7f2e8 4px);transform:translateZ(-2px) skewY(1deg);border-radius:0 4px 4px 0}
    .book-back{position:absolute;inset:4px 0 0 8px;border-radius:5px 12px 12px 5px;background:#573728;transform:translateZ(-9px)}
    .book-spine{position:absolute;left:-8px;top:0;height:100%;width:18px;background:linear-gradient(90deg,#603b2d,#a86a50,#704330);transform:rotateY(-90deg) translateZ(9px);transform-origin:right;border-radius:4px 0 0 4px}
    .floating-note{position:absolute;right:2%;top:18%;padding:13px 17px;background:rgba(255,253,247,.88);border:1px solid rgba(32,35,31,.08);box-shadow:0 12px 30px rgba(49,40,32,.08);font: .65rem var(--mono);color:var(--muted);transform:rotate(5deg);animation:float 5s ease-in-out infinite}
    .floating-note strong{display:block;color:var(--accent);font:500 .92rem var(--serif);margin-bottom:3px}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-top:1px solid var(--line);padding-top:27px;margin-bottom:25px}
    .section-head h2{margin:0;font-size:2rem}
    .text-link{font: .68rem var(--mono);text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:var(--accent);border-bottom:1px solid rgba(155,87,62,.35);padding-bottom:4px}
    .entries{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .entry{display:block;min-height:225px;padding:23px 22px 20px;text-decoration:none;border:1px solid var(--line);background:rgba(255,253,247,.42);transition:transform .35s,box-shadow .35s,background .35s;position:relative;overflow:hidden}
    .entry:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-70px;bottom:-75px;background:var(--accent-soft);opacity:0;transition:opacity .35s}
    .entry:hover{transform:translateY(-6px) rotateX(1deg);background:#fffdf7;box-shadow:0 18px 36px rgba(53,42,32,.08)}
    .entry:hover:before{opacity:.55}
    .entry-date{font: .64rem var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .entry h3{font:600 1.27rem var(--serif);margin:18px 0 9px;letter-spacing:-.02em}
    .entry p{font-size:.85rem;line-height:1.7;margin:0}
    .entry-arrow{position:absolute;right:20px;bottom:17px;color:var(--accent);font-size:1.1rem}
    .empty-note{padding:34px;border:1px dashed var(--line);color:var(--muted);text-align:center}
    .content-page{max-width:850px;margin:30px auto 0}
    .content-page>h1{font-size:clamp(2.4rem,5vw,4rem);margin:13px 0 30px}
    .content-page p,.content-page li{font-size:1rem;line-height:1.9;color:#5e6058}
    .content-page h2{margin-top:48px}
    .content-page a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}
    .content-page img{max-width:100%;height:auto}
    .content-page blockquote{margin:30px 0;padding:8px 25px;border-left:2px solid var(--accent);color:var(--muted);font-family:var(--serif);font-size:1.3rem}
    .post-list{display:grid;gap:12px}
    .post-row{display:flex;align-items:baseline;justify-content:space-between;gap:22px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
    .post-row span:first-child{font:500 1.25rem var(--serif)}
    .post-row span:last-child{font:.65rem var(--mono);color:var(--muted);white-space:nowrap}
    footer{border-top:1px solid var(--line);max-width:1104px;margin:0 auto;padding:24px 28px 38px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font:.67rem var(--mono);letter-spacing:.05em;text-transform:uppercase}
    .footer-mark{color:var(--accent)}
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
    .reveal.visible{opacity:1;transform:none}
    @keyframes book-arrive{from{opacity:0;transform:translateY(28px) rotateY(-38deg) rotateZ(-9deg)}to{opacity:1;transform:rotateY(-23deg) rotateZ(-5deg)}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-10px) rotate(3deg)}}
    @media(max-width:760px){
      .nav{padding:12px 20px}.menu-toggle{display:block}.navlinks{display:none;position:absolute;top:64px;left:0;right:0;background:var(--paper);padding:18px 22px 22px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:16px}.navlinks.open{display:flex}.navlinks a{margin:0}
      main{padding:32px 20px 70px}.journal-hero{grid-template-columns:1fr;gap:8px;padding:24px 0 48px}.hero-copy h1{font-size:clamp(2.8rem,13vw,4.4rem)}.book-stage{height:390px;margin-top:10px}.book{transform:scale(.88) rotateY(-23deg) rotateZ(-5deg)}.book-stage:hover .book{transform:scale(.88) rotateY(-8deg) rotateZ(-2deg) translateY(-9px)}.floating-note{right:0;top:10%}.entries{grid-template-columns:1fr}.entry{min-height:190px}.section-head{align-items:center}.section-head h2{font-size:1.7rem}footer{padding:22px 20px;flex-direction:column;gap:6px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <a class="brand" href="{{ '/' | relative_url }}">shanika<span>.</span>notes</a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="navlinks" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Journal</a>
      <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a>
      <a href="{{ '/projects' | relative_url }}" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a>
      <a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer><span>© {{ site.time | date: "%Y" }} · Shanika's digital journal</span><span>Made of curiosity <span class="footer-mark">✳</span> and little notes</span></footer>
<script>
  const menuButton=document.querySelector('.menu-toggle');
  const nav=document.querySelector('.navlinks');
  menuButton.addEventListener('click',()=>{const open=nav.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open));});
  const observer=new IntersectionObserver(items=>items.forEach(item=>{if(item.isIntersecting){item.target.classList.add('visible');observer.unobserve(item.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
  const stage=document.querySelector('.book-stage'),book=document.querySelector('.book');
  if(stage&&book&&matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){
    stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;book.style.transform=`rotateY(${-23+x*13}deg) rotateX(${-y*8}deg) rotateZ(-5deg) translateY(-5px)`;});
    stage.addEventListener('pointerleave',()=>book.style.transform='');
  }
</script>
</body>
</html>
