<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg-0:#020617;
      --bg-1:#0b1020;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#3b82f6;
      --accent-2:#7c3aed;
    }

    body{
      margin:0;
      font-family:Inter,system-ui,Arial;
      background:radial-gradient(circle at top, #111827 0,#020617 60%);
      color:var(--text);
      min-height:100vh;
    }

    header{
      border-bottom:1px solid rgba(255,255,255,0.05);
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(14px);
      background:rgba(10,15,28,0.75);
    }

    .nav{
      max-width:1100px;
      margin:0 auto;
      padding:16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    header .nav .brand{
      font-weight:600;
      font-size:1.5rem !important;
      letter-spacing:.015em;
    }

    header .nav .brand span{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      font-weight:900;
    }

    .nav-links a{
      margin-left:26px;
      text-decoration:none;
      font-size:1.02rem;
      font-weight:500;
      color:rgba(255,255,255,0.88);
      transition:0.25s ease;
    }

    .nav-links a:hover{
      color:white;
      text-shadow:0 0 18px rgba(124,58,237,0.95);
    }

    main{
      max-width:1100px;
      margin:0 auto;
      padding:40px 20px 80px;
    }

    footer{
      max-width:1100px;
      margin:50px auto 40px;
      padding:18px;
      text-align:center;
      color:var(--muted);
      font-size:.85rem;
      border-top:1px solid rgba(255,255,255,0.05);
    }

    /* =============================== */
    /* 💬 SOPHISTICATED CHATBOT */
    /* =============================== */

    #chat-button{
      position:fixed;
      bottom:26px;
      right:26px;
      width:60px;
      height:60px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:24px;
      box-shadow:0 15px 40px rgba(59,130,246,0.45);
      z-index:1000;
      transition:.3s ease;
    }

    #chat-button:hover{
      transform:scale(1.08);
      box-shadow:0 20px 55px rgba(124,58,237,0.55);
    }

    #chat-window{
      position:fixed;
      bottom:100px;
      right:26px;
      width:360px;
      height:460px;
      background:rgba(15,23,42,0.96);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,0.65);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      z-index:1000;
      opacity:0;
      transform:translateY(20px) scale(.96);
      pointer-events:none;
      transition:.3s ease;
    }

    #chat-window.active{
      opacity:1;
      transform:translateY(0) scale(1);
      pointer-events:auto;
    }

    #chat-header{
      padding:16px;
      font-weight:600;
      font-size:15px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
    }

    #chat-messages{
      flex:1;
      padding:16px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      font-size:13px;
    }

    .bubble{
      padding:10px 14px;
      border-radius:14px;
      max-width:80%;
      line-height:1.4;
    }

    .user{
      background:#1e293b;
      align-self:flex-end;
    }

    .bot{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      align-self:flex-start;
    }

    #chat-input-area{
      display:flex;
      border-top:1px solid rgba(255,255,255,0.05);
    }

    #chat-input{
      flex:1;
      border:none;
      padding:14px;
      background:#1e293b;
      color:white;
      outline:none;
      font-size:14px;
    }

    #chat-send{
      padding:14px 16px;
      background:var(--accent);
      border:none;
      color:white;
      cursor:pointer;
      font-weight:500;
      transition:.2s;
    }

    #chat-send:hover{
      background:var(--accent-2);
    }

  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">
      <span>Shanika</span>'s Blog
    </div>

    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about' | relative_url }}">About</a>
      <a href="{{ '/projects' | relative_url }}">Projects</a>
      <a href="{{ '/contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  © {{ site.title }} — Built with GitHub Pages
</footer>

<div id="chat-button">💬</div>

<div id="chat-window">
  <div id="chat-header">De Amos</div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <input type="text" id="chat-input" placeholder="Ask something..." />
    <button id="chat-send">Send</button>
  </div>
</div>

<script>
const chatButton = document.getElementById("chat-button");
const chatWindow = document.getElementById("chat-window");
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");
const chatSend = document.getElementById("chat-send");

let greeted = false;
let conversation = [];

chatButton.addEventListener("click", () => {
  chatWindow.classList.toggle("active");

  if(!greeted){
    setTimeout(()=>{
      addBotMessage("Hey there, I’m De Amos — Shanika’s AI companion. I can tell you about her work, projects, or answer tech questions.");
    },300);
    greeted = true;
  }
});

chatSend.addEventListener("click", sendMessage);
chatInput.addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});

function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;

  addUserMessage(text);
  conversation.push({role:"user",content:text});
  chatInput.value="";

  setTimeout(()=>{
    addBotMessage("I’ll soon be powered by Groq AI. For now, I'm in development mode.");
  },600);
}

function addUserMessage(text){
  const div=document.createElement("div");
  div.className="bubble user";
  div.textContent=text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop=chatMessages.scrollHeight;
}

function addBotMessage(text){
  const div=document.createElement("div");
  div.className="bubble bot";
  div.textContent=text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop=chatMessages.scrollHeight;
}
</script>

</body>
</html>
